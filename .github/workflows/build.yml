name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  display-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Water-turn, display recovery, navigation and waveform regressions
        shell: bash
        run: |
          python3 tools/run_reader_baseline.py
          python3 tools/boot_panel_actions_host_test.py
          python3 tools/lock_pin_host_test.py
          python3 tools/lock_screen_host_test.py
          python3 tools/reader_spacing_host_test.py
          python3 tools/test_book_toc.py
          python3 tools/vertical_punctuation_host_test.py
          python3 tools/vertical_number_host_test.py
          mkdir -p build/book-tests
          cc -std=c11 -D_DEFAULT_SOURCE -Wall -Wextra -Werror -g -fsanitize=address,undefined -fno-omit-frame-pointer -Imain/book -Imain -Itools/book_layout_stubs -Itools/book_source_host_stubs tools/book_layout_host_test.c main/book/reader_session.c main/book/book_layout.c main/book/html_text.c -o build/book-tests/layout
          build/book-tests/layout

  build:
    runs-on: ubuntu-latest
    # 钉在 v6.1 发布点。release-v6.1 分支会继续演进，LCD LL 接口已经变过一次。
    # Pin to the v6.1 release. The release-v6.1 branch keeps moving; the LCD LL API already changed once.
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4

      # CI 与 OTA 使用同一套 S31 产品配置；CI 叠加编译警告，不另建硬件参数副本。
      # CI and OTA share S31 product defaults; CI overlays warnings without duplicating hardware settings.
      - name: build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py --preview -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci" set-target esp32s31
          idf.py --preview -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci" build

      - name: size
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py --preview size
